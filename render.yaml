services:
  - type: web
    name: content-resourcer-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install && pnpm --filter @content-resourcer/db build && pnpm --filter @content-resourcer/worker build
    startCommand: pnpm --filter @content-resourcer/worker start
    envVars:
      - key: NODE_VERSION
        value: "20"
